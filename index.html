<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0f17;--s:rgba(20,26,38,.78);--ink:#e6ebf2;--mut:#8b96a8;--ln:#2a3344;--ac:#4f8ff7;--g:#3fcf8e;--r:#f26d6d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg) url(bg/login.svg) center/cover fixed no-repeat;color:var(--ink);font:15px/1.5 Inter,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
body[data-tab=dash]{background-image:url(bg/dash.svg)}body[data-tab=cal]{background-image:url(bg/cal.svg)}body[data-tab=tr]{background-image:url(bg/tr.svg)}body[data-tab=acc]{background-image:url(bg/acc.svg)}
.g{color:var(--g)}.r{color:var(--r)}

nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}

button{background:var(--ac);color:#fff;border-color:var(--ac);cursor:pointer}

:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.box{max-width:350px;margin:12vh auto;background:var(--s);backdrop-filter:blur(14px);border:1px solid var(--ln);padding:26px;border-radius:14px;display:grid;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.brand{margin:0;text-align:center;font:italic 700 40px/1.1 "Playfair Display",Georgia,serif;background:linear-gradient(90deg,#f4c27a,#f7e3c0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 8px;text-align:center;color:var(--mut);font-size:13px;letter-spacing:4px;text-transform:uppercase}
.panel{background:var(--s);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:12px}
.tiles div{background:var(--s);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
.tiles small{color:var(--mut);display:block}.tiles b{font-size:19px}
.rule{margin:8px 0}.rule>div:first-child{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar{height:9px;background:#0b0f17;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%}
.eq{width:100%;height:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal i{font-style:normal;color:var(--mut);text-align:center}
.cal u{text-decoration:none;min-height:66px;border:1px solid var(--ln);border-radius:6px;padding:3px 5px;font-size:13px}
.cal small{display:block;font-size:11px;font-weight:600}
.gb{background:rgba(63,207,142,.16);color:#7ee2b4}.rb{background:rgba(242,109,109,.16);color:#f7a0a0}
.accs td:last-child{text-align:right}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--ln)}th{color:var(--mut);font-weight:600}
td input,td select,td textarea{padding:4px 6px;width:100%}
td textarea{min-width:280px;resize:vertical;display:block;overflow:hidden;white-space:pre-wrap;line-height:1.4}td input{min-width:150px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.form label{display:grid;gap:2px;color:var(--mut);font-size:13px}
</style></head>

/* ---------- CSV reading (Match Trader, MT5, Tradovate) ---------- */
function csv(t){const r=[];let row=[],c="",q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}else if(ch=='"')q=1;else if(ch==','||ch==';'&&0){row.push(c);c=""}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=""}else c+=ch}if(c||row.length){row.push(c);r.push(row)}return r.filter(x=>x.join("").trim())}

function map(rows){
  const H=rows[0].map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,"")),f=(...k)=>{for(const x of k){const i=H.indexOf(x);if(i>=0)return i}return -1};
  const I={id:f("id","position","positionid","ticket","orderid"),sym:f("symbol","instrument","contract"),side:f("side","type","direction"),vol:f("volume","qty","quantity","size","lots"),o:f("opentime","timeopen","boughttimestamp","entrytime"),c:f("closetime","timeclose","soldtimestamp","exittime"),p:f("profit","pnl","netpl","netprofit"),cm:f("commission","commissions","fee","fees"),sw:f("swap"),bf:f("buyfillid"),sf:f("sellfillid"),op:f("openprice","entryprice"),cp:f("closeprice","exitprice")};

  const tv=H.includes("boughttimestamp"),df=tv?0:1,out=[];
  for(const r of rows.slice(1)){
    const sym=(r[I.sym]||"").trim();if(!sym||I.p<0)continue;
    let o=dt(r[I.o],df),c=dt(r[I.c],df),side=(r[I.side]||"").trim().toUpperCase();
    if(tv){const b=dt(r[I.o],df),s=dt(r[I.c],df);o=Math.min(b,s);c=Math.max(b,s);side=b<=s?"BUY":"SELL"}
    if(!c)continue;
    const pnl=num(r[I.p])+(I.cm>=0?num(r[I.cm]):0)+(I.sw>=0?num(r[I.sw]):0);
    let id=(r[I.id]||"").trim()||(I.bf>=0?r[I.bf]+"-"+r[I.sf]:"")||sym+o+c+pnl;
    out.push({id:(id+"_"+c+"_"+Math.round(pnl*100)).replace(/[^\w-]/g,"_"),sym,side:side.includes("SELL")?"SELL":"BUY",vol:num(r[I.vol]),open:o||c,close:c,pnl,gr:num(r[I.p]),op:I.op>=0?num(r[I.op]):0,cp:I.cp>=0?num(r[I.cp]):0,cm:I.cm>=0?num(r[I.cm]):0,sw:I.sw>=0?num(r[I.sw]):0});
  }return out}

/* ---------- Firebase ---------- */
if(!FB.apiKey){$("#app").innerHTML='<div class=box><h2>Almost there</h2><p>Open index.html in a text editor and paste your Firebase config values at the top.</p></div>'}
else{firebase.initializeApp(FB);db=firebase.firestore();firebase.auth().onAuthStateChanged(async u=>{U=u;u?await load():login()})}
const base=()=>db.collection("users").doc(U.uid);
async function load(){const[a,t]=await Promise.all([base().collection("accounts").get(),base().collection("trades").get()]);A=a.docs.map(d=>({...d.data(),id:d.id}));T=t.docs.map(d=>({...d.data(),id:d.id}));if(!A.find(x=>x.id==sel))sel=A[0]?.id||"";if(!A.length)tab="acc";render()}

async function auth(n){try{const a=firebase.auth(),e=$("#em").value,p=$("#pw").value;n?await a.createUserWithEmailAndPassword(e,p):await a.signInWithEmailAndPassword(e,p)}catch(x){$("#err").textContent=x.message}}
const cs=s=>{s=s.trim().replace(/%/g,"");if(!s||/^(nil|none|no|n\/a|na|-)$/i.test(s))return"Nil";const n=+s;return n>0&&n<=100?n:null};
async function addAcc(){const g=i=>$("#"+i).value,a={name:g("an").trim(),size:+g("as"),daily:+g("ad"),dd:+g("am"),target:+g("at"),type:g("ay"),cons:cs(g("ac"))};if(g("ak")=="steps"){a.steps=[1,2,3].map(n=>({size:+g("s"+n+"s"),target:+g("s"+n+"t"),dd:+g("s"+n+"d")}));if(a.steps.some(s=>!(s.size>0&&s.target>0)))return alert("Each step needs a balance and a profit target.");a.size=a.steps[0].size;a.target=a.steps[0].target;a.dd=a.steps[0].dd}else a.steps=[];if(!a.name||!a.size)return alert("Add an account name and size.");if(a.cons===null)return alert("Consistency rule: enter a percent between 1 and 100, or write Nil.");if(ed){await base().collection("accounts").doc(ed).update(a);sel=ed;ed=""}else{const r=await base().collection("accounts").add(a);sel=r.id;tab="dash"}await load()}
const editAcc=id=>{ed=id;sel=id;tab="acc";render();$("#an").focus()},cancelEd=()=>{ed="";render()};
async function delAcc(id){if(id)sel=id;const a=A.find(x=>x.id==sel);if(!a||!confirm(`Delete "${a.name}" and all its trades?`))return;if(ed==sel)ed="";const col=base().collection("trades");for(const t of T.filter(t=>t.acc==sel))await col.doc(t.id).delete();await base().collection("accounts").doc(sel).delete();sel="";await load()}
async function imp(inp,past){const f=inp.files[0];if(!f)return;if(!sel)return alert("Create an account first.");const R=csv((await f.text()).replace(/^\uFEFF/,"")),L=map(R);if(!L.length)return alert("No closed trades found in this file.");const col=base().collection("trades");for(let i=0;i<L.length;i+=400){const b=db.batch();L.slice(i,i+400).forEach(t=>b.set(col.doc(sel+"_"+t.id),{...t,acc:sel,...(past?{past:true}:{})},{merge:true}));await b.commit()}inp.value="";const sm=k=>L.reduce((x,t)=>x+t[k],0);alert(L.length+" trades imported"+(past?" as past trades":"")+" from "+(R.length-1)+" rows ("+(R.length-1-L.length)+" skipped).\nProfit column: "+money(sm("gr"))+"\nCommission: "+money(sm("cm"))+"\nSwap: "+money(sm("sw"))+"\nNet total: "+money(sm("pnl"))+"\nCompare these with your prop firm.");await load()}
async function note(id,k,v){const t=T.find(x=>x.id==id);t[k]=v;await base().collection("trades").doc(id).update({[k]:v})}

/* ---------- Views ---------- */
function stats(tl){const fo=tl.filter(t=>t.follow),fy=fo.filter(t=>t.follow=="Followed").length;const by={};tl.forEach(t=>{const d=key(t.close);by[d]=(by[d]||0)+t.pnl});const dv=Object.values(by);const w=tl.filter(t=>t.pnl>0),l=tl.filter(t=>t.pnl<0),gw=w.reduce((a,t)=>a+t.pnl,0),gl=-l.reduce((a,t)=>a+t.pnl,0),net=gw-gl,n=tl.length;
return `<div class=tiles><div><small>Net P&L</small><b class="${cls(net)}">${money(net)}</b></div><div><small>Trades</small><b>${n}</b></div><div><small>Win rate</small><b>${n?Math.round(w.length/n*100):0}%</b></div><div><small>Profit factor</small><b>${gl?(gw/gl).toFixed(2):w.length?"∞":"0"}</b></div><div><small>Avg win / loss</small><b>${money(w.length?gw/w.length:0)} / ${money(l.length?-gl/l.length:0)}</b></div><div><small>Best / worst trade</small><b>${money(n?Math.max(...tl.map(t=>t.pnl)):0)} / ${money(n?Math.min(...tl.map(t=>t.pnl)):0)}</b></div><div><small>Rules followed</small><b>${fo.length?Math.round(fy/fo.length*100)+"% ("+fy+"/"+fo.length+")":"-"}</b></div><div><small>Best / worst day</small><b>${money(dv.length?Math.max(...dv):0)} / ${money(dv.length?Math.min(...dv):0)}</b></div></div>`}
let CH,EQ;
function eq(tl,size){if(!tl.length)return"<p>No trades yet. Import a CSV to see your equity curve.</p>";EQ={tl,size};return `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px"><button class=ghost onclick="CH&&CH.timeScale().fitContent()">Fit all</button><button class=ghost onclick="CH&&CH.priceScale('right').applyOptions({autoScale:true})">Reset height</button><b id=eqv style="margin-left:auto"></b></div><div id=eqc style="height:340px"></div><small style="color:var(--mut)">Scroll or pinch to zoom, drag to move, drag the numbers on the right to stretch.</small>`}
function drawEq(){const el=$("#eqc");if(!el||!EQ)return;if(typeof LightweightCharts=="undefined"){el.textContent="The chart could not load. Check your internet connection and refresh.";return}
const{tl,size}=EQ,s=[...tl].sort((a,b)=>a.close-b.close),off=ms=>Math.floor(ms/1000)-new Date(ms).getTimezoneOffset()*60;let b=size,prev=off(Math.min(s[0].open||s[0].close,s[0].close-60000));const d=[{time:prev,value:b}];
s.forEach(t=>{const x=Math.max(off(t.close),prev+1);prev=x;d.push({time:x,value:b+=t.pnl})});
CH=LightweightCharts.createChart(el,{autoSize:true,layout:{background:{color:"transparent"},textColor:"#9aa7bd"},grid:{vertLines:{color:"rgba(255,255,255,.06)"},horzLines:{color:"rgba(255,255,255,.09)"}},rightPriceScale:{borderColor:"#2a3347"},timeScale:{borderColor:"#2a3347",timeVisible:true,secondsVisible:false},localization:{priceFormatter:v=>"$"+v.toLocaleString(undefined,{maximumFractionDigits:2})}});
const ser=CH.addAreaSeries({lineColor:"#4f8ff7",topColor:"rgba(79,143,247,.35)",bottomColor:"rgba(79,143,247,0)",lineWidth:2});ser.setData(d);ser.createPriceLine({price:size,color:"#9aa7bd",lineStyle:2,lineWidth:1,title:"Start"});CH.timeScale().fitContent();
CH.subscribeCrosshairMove(p=>{const v=p.seriesData&&p.seriesData.get(ser);$("#eqv").textContent=v?"$"+v.value.toLocaleString(undefined,{maximumFractionDigits:2})+" · "+new Date(p.time*1000).toLocaleString([],{timeZone:"UTC",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):""})}
const fit=a=>{a.style.height="auto";a.style.height=a.scrollHeight+"px"};
function render(){try{CH&&CH.remove()}catch(e){}CH=null;render0();drawEq();document.querySelectorAll("textarea.nt").forEach(fit)}
function consRule(a,tl){if(typeof a.cons!="number")return`<p>Consistency rule: <b>Nil</b></p>`;const by={};tl.forEach(t=>by[key(t.close)]=(by[key(t.close)]||0)+t.pnl);const net=tl.reduce((x,t)=>x+t.pnl,0),best=Math.max(0,...Object.values(by)),pc=net>0?best/net*100:0,p=Math.min(100,pc/a.cons*100);return `<div class=rule><div><span>Consistency (best day vs total profit)</span><b>${pc.toFixed(1)}% of ${a.cons}% allowed</b></div><div class=bar><i style="width:${p}%;background:${pc>a.cons?"var(--r)":p>75?"var(--ac)":"var(--g)"}"></i></div><small style="color:var(--mut)">Best day ${money(best)} of total profit ${money(Math.max(0,net))}</small></div>`}
function rules(a,tl){const net=tl.reduce((x,t)=>x+t.pnl,0),bal=a.size+net;let pk=a.size,b=a.size;[...tl].sort((x,y)=>x.close-y.close).forEach(t=>pk=Math.max(pk,b+=t.pnl));
const day=tl.filter(t=>key(t.close)==key(Date.now())).reduce((x,t)=>x+t.pnl,0),dd=Math.max(0,a.type=="trailing"?pk-bal:a.size-bal);
const bar=(l,v,max,good)=>{if(!(max>0))return"";const p=max?Math.max(0,Math.min(100,v/max*100)):0;return `<div class=rule><div><span>${l}</span><b>${money(v)} of ${money(max)}</b></div><div class=bar><i style="width:${p}%;background:${good?"var(--g)":p>75?"var(--r)":"var(--ac)"}"></i></div></div>`};
return `<p>Balance <b class="${cls(net)}">${money(bal)}</b> (${a.type=="trailing"?"trailing":"static"} drawdown)</p>`+bar("Profit target",Math.max(0,net),a.target,1)+bar("Daily loss used today",Math.max(0,-day),a.daily)+bar("Max drawdown used",dd,a.dd)+consRule(a,tl)+`<small style="color:var(--mut)">Based on closed trades only. Your firm's own dashboard is the final word.</small>`}
function cal(tl){const y=cur.getFullYear(),m=cur.getMonth(),by={},cn={};tl.forEach(t=>{const k=key(t.close);by[k]=(by[k]||0)+t.pnl;cn[k]=(cn[k]||0)+1});const first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
let h=`<div class=nav><button class=ghost onclick="mv(-1)" aria-label="Previous month">‹</button><b>${cur.toLocaleString(undefined,{month:"long",year:"numeric"})}</b><button class=ghost onclick="mv(1)" aria-label="Next month">›</button></div><div class=cal>`+"MTWTFSS".split("").map(d=>`<i>${d}</i>`).join("");
for(let i=0;i<first;i++)h+="<u></u>";for(let d=1;d<=n;d++){const k=y+"-"+p2(m+1)+"-"+p2(d),v=by[k],c=cn[k];h+=`<u class="${v==null?"":v>=0?"gb":"rb"}">${d}${v==null?"":`<small>${money(v)}</small><small style="font-weight:400">${c} trade${c>1?"s":""}</small>`}</u>`}return h+"</div>"}
const mv=n=>{cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);render()};
const opt=(arr,v)=>`<option value="">-</option>`+arr.map(x=>`<option${x==v?" selected":""}>${x}</option>`).join("");
const held=ms=>{if(!(ms>=1000))return"-";const s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?`${h}h ${p2(m)}m`:m?`${m}m ${p2(r)}s`:`${r}s`};
const dq={};

function rk(e,a){if(e.key!="Enter"||e.shiftKey)return;e.preventDefault();const p=a.selectionStart,n=a.value.slice(0,p).split("\n").length+1,s="\n"+n+". ";a.value=a.value.slice(0,p)+s+a.value.slice(p);a.setSelectionRange(p+s.length,p+s.length);fit(a);sv(a.dataset.id,"rules",a.value)}
function rb(a){const L=a.value.split("\n").filter(l=>l.trim()&&!/^\d+\.\s*$/.test(l.trim())).map((l,i)=>(i+1)+". "+l.replace(/^\d+\.\s*/,""));a.value=L.join("\n");fit(a);sv(a.dataset.id,"rules",a.value)}
function trades(tl){if(!tl.length)return"<p>No trades yet.</p>";return `<div class=scroll><table><tr><th>Opened</th><th>Closed</th><th>Held</th><th>Symbol</th><th>Side</th><th>Lots</th><th>Net P&L</th><th>Felt</th><th>Rules</th><th>Followed?</th><th>Notes</th><th>Screenshot</th></tr>`+[...tl].sort((a,b)=>b.close-a.close).map(t=>`<tr><td style="font-size:13px" title="${new Date(t.open||t.close).toLocaleDateString()}">${new Date(t.open||t.close).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</td><td style="font-size:13px" title="${new Date(t.close).toLocaleDateString()}">${new Date(t.close).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</td><td>${held(t.close-t.open)}</td><td>${esc(t.sym)}</td><td>${t.side}</td><td>${t.vol?+t.vol:"-"}</td><td class="${cls(t.pnl)}">${money(t.pnl)}</td>${t.past?'<td style="color:var(--mut)">-</td>'.repeat(5):`<td><select style="min-width:130px" onchange="note('${t.id}','mood',this.value)">${opt(["Calm","Confident","FOMO","Revenge","Fearful","Bored"],t.mood)}</select></td><td><textarea class=nt data-id="${t.id}" rows=1 placeholder="1. " onfocus="rf(this)" onkeydown="rk(event,this)" onblur="rb(this)" oninput="fit(this);sv('${t.id}','rules',this.value)">${esc(t.rules)}</textarea></td><td><select style="color:${t.follow=="Followed"?"var(--g)":t.follow=="Broke"?"var(--r)":"inherit"}" onchange="note('${t.id}','follow',this.value).then(render)">${opt(["Followed","Broke"],t.follow)}</select></td><td><textarea class=nt rows=1 placeholder="What happened?" oninput="fit(this);sv('${t.id}','note',this.value)" onchange="note('${t.id}','note',this.value)">${esc(t.note)}</textarea></td><td style="white-space:nowrap"><input value="${esc(t.shot)}" placeholder="Paste link" style="min-width:0;width:95px" oninput="shot('${t.id}',this)" onchange="shot('${t.id}',this,1)">${t.shot?` <a href="${esc(t.shot)}" target=_blank rel=noopener style="color:#4f8ff7">Open</a>`:""}</td>`}</tr>`).join("")+"</table></div>"}
const stepsForm=e=>{const on=e.steps&&e.steps.length,S=on?e.steps:[{size:5000,target:300},{size:10000,target:600},{size:20000,target:1200}];return `<div id=sp class=form style="display:${on?"grid":"none"};margin-top:8px">`+S.map((s,i)=>`<label>Step ${i+1} balance<input id=s${i+1}s type=number value="${s.size||""}"></label><label>Step ${i+1} target ($)<input id=s${i+1}t type=number value="${s.target||""}"></label><label>Step ${i+1} max loss ($)<input id=s${i+1}d type=number value="${s.dd||""}"></label>`).join("")+`<small style="grid-column:1/-1;color:var(--mut)">Step 1 is your $300 target. Steps 2 and 3 are pre-filled at 6% to match it, so check them against The5ers' rules.</small></div>`};
function stepInfo(a,tl){const S=a.steps;if(!S||!S.length)return null;let i=0,run=0,cur=[],pass=[],done=false;for(const t of[...tl].sort((x,y)=>x.close-y.close)){cur.push(t);run+=t.pnl;if(!done&&S[i].target>0&&run>=S[i].target){pass.push({i,time:t.close});if(i<S.length-1){i++;run=0;cur=[]}else done=true}}return{i,S,cur,pass,done,st:S[i]}}
function dashHtml(a,tl){const si=stepInfo(a,tl);if(!si)return `<div class=panel>${rules(a,tl)}</div>${stats(tl)}<div class=panel>${eq(tl,a.size)}</div>`;const st=si.st,b={...a,size:st.size,target:st.target,dd:st.dd||0};return `<div class=panel><b>${si.done?"All "+si.S.length+" steps passed. You are funded!":"Step "+(si.i+1)+" of "+si.S.length+": "+money(st.size)+" account, target "+money(st.target)}</b>${si.pass.map(p=>`<div class=g>✔ Step ${p.i+1} passed on ${new Date(p.time).toLocaleDateString()}</div>`).join("")}</div><div class=panel>${rules(b,si.cur)}</div>${stats(si.cur)}<div class=panel>${eq(si.cur,st.size)}</div>`}
function accForm(){const e=A.find(x=>x.id==ed)||{},v=k=>e[k]!=null?esc(e[k]):"";
const list=A.length?`<div class=panel><h3>Your accounts</h3><div class=scroll><table class=accs><tr><th>Name</th><th>Balance</th><th>Daily loss</th><th>Max DD</th><th>Target</th><th>Type</th><th>Consistency</th><th></th></tr>${A.map(a=>`<tr><td>${esc(a.name)}${a.steps&&a.steps.length?" (3-step)":""}</td><td>${money(a.size||0)}</td><td>${money(a.daily||0)}</td><td>${money(a.dd||0)}</td><td>${money(a.target||0)}</td><td>${a.type=="trailing"?"Trailing":"Static"}</td><td>${typeof a.cons=="number"?a.cons+"%":"Nil"}</td><td><button class="ghost sm" onclick="editAcc('${a.id}')">Edit</button> <button class="ghost sm" onclick="delAcc('${a.id}')">Delete</button></td></tr>`).join("")}</table></div></div>`:"";
return list+`<div class=panel><h3>${ed?"Edit account":"Add a prop account"}</h3><div class=form><label>Name<input id=an placeholder="GFT 50k" value="${v("name")}"></label><label>Starting balance<input id=as type=number value="${v("size")}"></label><label>Daily loss limit ($)<input id=ad type=number value="${v("daily")}"></label><label>Max drawdown ($)<input id=am type=number value="${v("dd")}"></label><label>Profit target ($)<input id=at type=number value="${v("target")}"></label><label>Drawdown type<select id=ay><option value=static>Static</option><option value=trailing${e.type=="trailing"?" selected":""}>Trailing</option></select></label><label>Consistency rule (% or Nil)<input id=ac placeholder="30, or Nil" value="${typeof e.cons=="number"?e.cons:"Nil"}"></label><label>Account kind<select id=ak onchange="$('#sp').style.display=this.value=='steps'?'grid':'none'"><option value=single>Single account</option><option value=steps${e.steps&&e.steps.length?" selected":""}>3-step Bootcamp</option></select></label></div>${stepsForm(e)}<p><button onclick="addAcc()">${ed?"Save changes":"Save account"}</button>${ed?` <button class=ghost onclick="cancelEd()">Cancel</button>`:""}</p></div>`}
function render0(){
  const a=A.find(x=>x.id==sel),tl=T.filter(t=>t.acc==sel),tabs={dash:"Dashboard",cal:"Calendar",tr:"Trades",acc:"Accounts"};
  document.body.dataset.tab=tab;if(tab!="acc")ed="";
  let body=tab=="acc"?accForm():!a?"<p>Add an account first.</p>":tab=="dash"?dashHtml(a,tl):tab=="cal"?`<div class=panel>${cal(tl)}</div>`:`<div class=panel>${trades(tl)}</div>`;
  $("#app").innerHTML=`<header><b>Scalp Journal</b><select onchange="sel=this.value;render()" aria-label="Account">${A.map(x=>`<option value="${x.id}"${x.id==sel?" selected":""}>${esc(x.name)}</option>`).join("")}</select><button onclick="$('#f').click()">Import CSV</button><input id=f type=file accept=".csv" hidden onchange="imp(this)"><button class=ghost onclick="$('#fp').click()">Import past trades</button><input id=fp type=file accept=".csv" hidden onchange="imp(this,1)"><button class=ghost onclick="firebase.auth().signOut()">Sign out</button></header><main><nav>${Object.entries(tabs).map(([k,v])=>`<button class="${tab==k?"on":"ghost"}" onclick="tab='${k}';render()">${v}</button>`).join("")}</nav>${body}</main>`}
</script></body></html>
